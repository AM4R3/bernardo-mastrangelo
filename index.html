  /* UTM-ready: a origem da campanha viaja junto na mensagem, sem quebrar o link */
  function refTag(){
    try{
      var q = new URLSearchParams(location.search);
      var src = q.get("utm_source") || (q.get("fbclid") ? "meta-ads" : null);
      var camp = q.get("utm_campaign");
      if(!src && !camp) return "";
      return "\n\n(ref: " + [src,camp].filter(Boolean).join(" / ") + ")";
    }catch(e){ return ""; }
  }

  function apply(lang){
    var d = DICT[lang] || DICT.pt;
    document.documentElement.lang = d.htmlLang;
    document.title = d.title;

    document.querySelectorAll("[data-i18n]").forEach(function(el){
      var v = d[el.getAttribute("data-i18n")];

  function pick(){
    try{
      var q = new URLSearchParams(location.search).get("lang");

      var saved = localStorage.getItem("bm-lang");
      if(saved && DICT[saved]) return saved;

    if(nav.indexOf("es") === 0) return "es";

  document.querySelectorAll(".lang button").forEach(function(b){

  });

  apply(pick());
